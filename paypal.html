<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dceeff">
  <title>PetRide | Canasta para mascotas</title>
  <style>
    :root { color-scheme: light; --navy:#17345d; --blue:#dceeff; --accent:#1769aa; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 16px; background:linear-gradient(145deg,#c9e4ff,#eef7ff 58%,#b7d9f7); color:#203044; font-family:Arial, sans-serif; }
    main { width:min(100%, 430px); padding:30px; border:1px solid #ffffffa8; border-radius:24px; background:#fff; box-shadow:0 22px 60px #24496b26; text-align:center; }
    .brand { margin:0 0 22px; color:var(--navy); font-size:30px; letter-spacing:-1px; }
    .product-image { display:block; width:100%; height:230px; object-fit:cover; border-radius:16px; background:#e8f3fd; }
    h2 { margin:22px 0 8px; color:var(--navy); font-size:22px; }
    .description { margin:0 auto; max-width:32ch; color:#63758b; line-height:1.55; }
    .price { margin:22px 0 5px; color:var(--accent); font-size:27px; font-weight:700; }
    .currency { color:#8392a3; font-size:13px; }
    h3 { margin:24px 0 14px; font-size:15px; color:#31465d; }
    #paypal-button-container { min-height:45px; }
    #resultado { display:none; margin:16px 0 0; padding:14px; border-radius:12px; font-size:14px; line-height:1.55; white-space:pre-line; }
    #resultado.visible { display:block; }
    #resultado.success { color:#17613f; background:#e9f7ef; border:1px solid #b9e4ca; }
    #resultado.error { color:#96372f; background:#fff0ee; border:1px solid #f1c4bf; }
    .hint { margin:18px 0 0; color:#8a98a8; font-size:12px; line-height:1.45; }
    @media (max-width:420px) { main { padding:23px 19px; } .product-image { height:205px; } }
  </style>
  <!-- Identificador de prueba sandbox de PayPal. -->
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=MXN&intent=capture&components=buttons&locale=es_MX"></script>
</head>
<body>
  <main>
    <h1 class="brand">PetRide</h1>
    <img class="product-image" src="assets/mascota.jpg" alt="Canasta para mascotas">
    <h2>Canasta para mascotas</h2>
    <p class="description">Una forma cómoda y segura de llevar a tu mascota contigo en cada paseo.</p>
    <p class="price">$800.00</p>
    <p class="currency">MXN</p>
    <h3>Realizar pago</h3>
    <div id="paypal-button-container"></div>
    <p id="resultado" role="status" aria-live="polite"></p>
  </main>
  <script>
    const resultado = document.getElementById("resultado");

    if (window.paypal && paypal.Buttons) {
      paypal.Buttons({
        createOrder: function(data, actions) {
          return actions.order.create({
            purchase_units: [{
              description: "Canasta para mascotas",
              amount: {
                currency_code: "MXN",
                value: "800.00"
              }
            }]
          });
        },
        onApprove: function(data, actions) {
          return actions.order.capture().then(function(details) {
            const nombre = [details.payer?.name?.given_name, details.payer?.name?.surname].filter(Boolean).join(" ") || "cliente";
            resultado.className = "visible success";
            resultado.textContent = "¡Compra realizada exitosamente!\nComprador: " + nombre + "\nOrden: " + data.orderID;
          });
        },
        onError: function(error) {
          console.error(error);
          resultado.className = "visible error";
          resultado.textContent = "Ocurrió un error al procesar el pago.";
        }
      }).render("#paypal-button-container").catch(function(error) {
        console.error("No se pudo mostrar el botón PayPal:", error);
        resultado.className = "visible error";
        resultado.textContent = "PayPal no pudo iniciar. Revisa el Client ID y tu conexión a Internet.";
      });
    } else {
      resultado.className = "visible error";
      resultado.textContent = "No se pudo cargar PayPal. Revisa tu conexión a Internet y el Client ID de la aplicación.";
    }
  </script>
</body>
</html>
